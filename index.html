<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>提携企業</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4a3c0">
<meta name="apple-mobile-web-app-title" content="提携企業">
<meta name="description" content="業務提携先を自衛隊・企業・企業（チラシのみ）・店舗に分けて、企画書・契約書・写真・訪問履歴をまとめて管理するアプリ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: two-pane workspace — partner index on the left (category tabs + list), partner "chart" on the right with section tabs. Stacks to one pane on phones. */
:root {
  --bg: #fff6f9;
  --surface: #ffffff;
  --surface-2: #fdeaf1;
  --line: #f2d4df;
  --fg: #4a2e3a;
  --muted: #8d6a78;
  --accent: #ec8fb0;
  --accent-strong: #c24f7a;
  --accent-soft: #fbdbe7;
  --on-accent: #ffffff;
  --warn-bg: #fff0d9; --warn-fg: #9a5a12;
  --bad-bg: #fde2e2;  --bad-fg: #b23a3a;
  --good-bg: #e2f3e6; --good-fg: #2f7044;
  --c-sdf-bg: #e2efe0;   --c-sdf-fg: #3f6a46;
  --c-corp-bg: #fbdbe7;  --c-corp-fg: #a73d66;
  --c-flyer-bg: #ffe6d4; --c-flyer-fg: #9c552a;
  --c-store-bg: #ebe2f8; --c-store-fg: #694c9b;
  --shadow: 0 1px 2px rgba(150, 70, 100, .06), 0 8px 24px rgba(200, 90, 130, .08);
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r-sm: 8px; --r-md: 14px; --r-lg: 20px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #221a1e; --surface: #2c2228; --surface-2: #372a31; --line: #4a3640;
    --fg: #f7e5ec; --muted: #c4a2b0; --accent: #f29bba; --accent-strong: #f5adc6;
    --accent-soft: #4a2c39; --on-accent: #2a1820;
    --warn-bg: #45331b; --warn-fg: #f3c88a; --bad-bg: #4a2626; --bad-fg: #f4a3a3;
    --good-bg: #24392a; --good-fg: #a5dbb2;
    --c-sdf-bg: #2b3a2c; --c-sdf-fg: #b4d8b5; --c-corp-bg: #4a2c39; --c-corp-fg: #f6b5cd;
    --c-flyer-bg: #46311f; --c-flyer-fg: #f5c49e; --c-store-bg: #352c48; --c-store-fg: #cfbcf0;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #221a1e; --surface: #2c2228; --surface-2: #372a31; --line: #4a3640;
  --fg: #f7e5ec; --muted: #c4a2b0; --accent: #f29bba; --accent-strong: #f5adc6;
  --accent-soft: #4a2c39; --on-accent: #2a1820;
  --warn-bg: #45331b; --warn-fg: #f3c88a; --bad-bg: #4a2626; --bad-fg: #f4a3a3;
  --good-bg: #24392a; --good-fg: #a5dbb2;
  --c-sdf-bg: #2b3a2c; --c-sdf-fg: #b4d8b5; --c-corp-bg: #4a2c39; --c-corp-fg: #f6b5cd;
  --c-flyer-bg: #46311f; --c-flyer-fg: #f5c49e; --c-store-bg: #352c48; --c-store-fg: #cfbcf0;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
html, body { height: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0;
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 14px; line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.app { min-height: 100%; display: flex; flex-direction: column; padding-inline: 16px; padding-block: 0 24px; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-block: 18px; max-width: 1280px; width: 100%; margin-inline: auto;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark { width: 44px; height: 44px; flex: none; display: block; }
.brand h1 { font-size: 22px; font-weight: 700; letter-spacing: .02em; }
.brand p { margin: 0; font-size: 12px; color: var(--muted); }
.top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mode-note { font-size: 12px; color: var(--muted); background: var(--surface-2); padding: 4px 10px; border-radius: 999px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 999px; padding: 7px 16px; cursor: pointer; font-weight: 500; font-size: 13px;
  transition: background .15s, border-color .15s;
  white-space: nowrap; text-decoration: none;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn.danger { color: var(--bad-fg); }
.btn.armed { background: var(--bad-bg); border-color: var(--bad-fg); color: var(--bad-fg); }
.btn.sm { padding: 4px 12px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.layout {
  display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px;
  max-width: 1280px; width: 100%; margin-inline: auto; flex: 1; min-height: 0;
}

/* Sidebar */
.sidebar { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cats { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
.cat-tab {
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md);
  padding: 10px 12px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px;
  transition: border-color .15s, background .15s;
}
.cat-tab .lbl { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.cat-tab .cnt { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1.2; }
.cat-tab .cnt small { font-size: 11px; font-family: var(--font-body); color: var(--muted); margin-left: 2px; font-weight: 400; }
.cat-tab:hover { border-color: var(--accent); }
.cat-tab[aria-pressed="true"] { border-color: var(--accent-strong); background: var(--accent-soft); }
.cat-tab.all { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.sdf { background: var(--c-sdf-fg); } .dot.corp { background: var(--c-corp-fg); }
.dot.flyer { background: var(--c-flyer-fg); } .dot.store { background: var(--c-store-fg); }

.search { position: relative; }
.search input {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 9px 14px 9px 36px; outline: none;
}
.search input:focus { border-color: var(--accent-strong); }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }

.plist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.pitem {
  width: 100%; border: 1px solid transparent; background: transparent; border-radius: var(--r-md);
  padding: 10px 12px; text-align: left; cursor: pointer; display: grid; gap: 4px;
}
.pitem:hover { background: var(--surface); border-color: var(--line); }
.pitem[aria-current="true"] { background: var(--surface); border-color: var(--accent); box-shadow: var(--shadow); }
.pitem .row1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pitem .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.pitem .meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.list-empty { color: var(--muted); font-size: 13px; padding: 16px 12px; }

.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 999px;
  font-size: 11px; font-weight: 500; white-space: nowrap; letter-spacing: .02em;
}
.chip.sdf { background: var(--c-sdf-bg); color: var(--c-sdf-fg); }
.chip.corp { background: var(--c-corp-bg); color: var(--c-corp-fg); }
.chip.flyer { background: var(--c-flyer-bg); color: var(--c-flyer-fg); }
.chip.store { background: var(--c-store-bg); color: var(--c-store-fg); }
.chip.st { background: var(--surface-2); color: var(--muted); }
.chip.st.active { background: var(--good-bg); color: var(--good-fg); }
.chip.warn { background: var(--warn-bg); color: var(--warn-fg); }
.chip.bad { background: var(--bad-bg); color: var(--bad-fg); }

/* Detail */
.detail {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow); min-width: 0; display: flex; flex-direction: column; overflow: hidden;
}
.d-head { padding: 22px 24px 0; display: flex; flex-direction: column; gap: 10px; }
.d-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.d-title h2 { font-size: 26px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.d-chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.d-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.back { display: none; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding-inline: 16px; overflow-x: auto; scrollbar-width: none; margin-top: 8px; }
.tab {
  border: 0; background: none; padding: 10px 12px; cursor: pointer; color: var(--muted); font-weight: 500;
  border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center;
}
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--accent-strong); border-bottom-color: var(--accent-strong); }
.tab .n { font-family: var(--font-mono); font-size: 11px; background: var(--surface-2); border-radius: 999px; padding: 0 7px; color: var(--muted); }
.tab[aria-selected="true"] .n { background: var(--accent-soft); color: var(--accent-strong); }

.d-body { padding: 22px 24px 28px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.section-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.section-h h3 { font-size: 16px; font-weight: 700; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }

.info { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px 24px; margin: 0; }
.info div { min-width: 0; }
.info dt { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.info dd { margin: 2px 0 0; overflow-wrap: anywhere; }
.info dd.empty { color: var(--muted); }
.info .wide { grid-column: 1 / -1; }
.memo { white-space: pre-wrap; background: var(--surface-2); border-radius: var(--r-md); padding: 12px 14px; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }
.stat {
  border: 1px solid var(--line); background: var(--bg); border-radius: var(--r-md); padding: 12px 14px; cursor: pointer; text-align: left;
  display: flex; flex-direction: column; gap: 2px;
}
.stat:hover { border-color: var(--accent); }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1.2; }
.stat .s { font-size: 11px; color: var(--muted); }

/* Forms */
.form { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px 16px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label, .field .lab { font-size: 12px; color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea {
  border: 1px solid var(--line); background: var(--bg); border-radius: var(--r-sm); padding: 8px 10px; width: 100%; outline: none;
}
.field textarea { min-height: 88px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent-strong); background: var(--surface); }
.form-actions { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.req { color: var(--accent-strong); }
.cat-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.cat-pick button { border: 1px solid var(--line); background: var(--bg); padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.cat-pick button[aria-pressed="true"] { border-color: var(--accent-strong); background: var(--accent-soft); color: var(--accent-strong); font-weight: 700; }

/* Files */
.dropzone {
  border: 1.5px dashed var(--accent); border-radius: var(--r-md); background: var(--bg);
  padding: 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  transition: background .15s;
}
.dropzone.over { background: var(--accent-soft); }
.dropzone p { margin: 0; font-size: 13px; color: var(--muted); }
.dropzone strong { color: var(--fg); }
.flist { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.frow { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); min-width: 0; }
.frow:first-child { border-top: 0; }
.ficon {
  width: 36px; height: 36px; border-radius: 10px; flex: none; display: grid; place-items: center;
  font-family: var(--font-mono); font-size: 10px; font-weight: 500; background: var(--accent-soft); color: var(--accent-strong);
  overflow: hidden;
}
.ficon img { width: 100%; height: 100%; object-fit: cover; }
.finfo { flex: 1; min-width: 0; }
.finfo a { font-weight: 500; color: var(--fg); text-decoration: none; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.finfo a:hover { color: var(--accent-strong); text-decoration: underline; }
.finfo .fm { font-size: 11px; color: var(--muted); }
.factions { display: flex; gap: 4px; flex: none; }

.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.photo { position: relative; border-radius: var(--r-md); overflow: hidden; background: var(--surface-2); aspect-ratio: 4 / 3; max-width: 100%; }
.photo button.open { border: 0; padding: 0; width: 100%; height: 100%; cursor: zoom-in; display: block; background: none; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .pdel { position: absolute; top: 6px; right: 6px; }
.photo .pdel .btn { background: var(--surface); }
.photo .cap { position: absolute; left: 0; right: 0; bottom: 0; font-size: 11px; padding: 14px 8px 5px; color: #fff; background: linear-gradient(transparent, rgba(40,15,25,.6)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none; }

/* Visits */
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.visit { display: grid; grid-template-columns: 104px minmax(0,1fr); gap: 16px; padding-block: 14px; border-top: 1px solid var(--line); }
.visit:first-child { border-top: 0; }
.vdate { font-family: var(--font-mono); font-size: 13px; color: var(--accent-strong); font-weight: 500; }
.vdate small { display: block; font-family: var(--font-body); color: var(--muted); font-size: 11px; font-weight: 400; }
.vbody { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.vtop { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
.vpurpose { font-weight: 700; }
.vperson { font-size: 12px; color: var(--muted); }
.vnotes { white-space: pre-wrap; overflow-wrap: anywhere; }
.card-form { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px; }

.empty {
  text-align: center; padding: 28px 16px; color: var(--muted); font-size: 13px;
  border: 1px dashed var(--line); border-radius: var(--r-md);
}

/* Welcome */
.welcome { padding: 40px 32px; display: flex; flex-direction: column; gap: 22px; }
.welcome h2 { font-size: 24px; }
.welcome p { margin: 0; color: var(--muted); max-width: 60ch; }
.wgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.wcard { border-radius: var(--r-md); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.wcard b { font-family: var(--font-display); font-size: 15px; }
.wcard span { font-size: 12px; opacity: .85; }
.wcard.sdf { background: var(--c-sdf-bg); color: var(--c-sdf-fg); }
.wcard.corp { background: var(--c-corp-bg); color: var(--c-corp-fg); }
.wcard.flyer { background: var(--c-flyer-bg); color: var(--c-flyer-fg); }
.wcard.store { background: var(--c-store-bg); color: var(--c-store-fg); }
.notice { background: var(--surface-2); border-radius: var(--r-md); padding: 12px 14px; font-size: 12px; color: var(--muted); max-width: 70ch; }
.notice b { color: var(--fg); }

/* Modal + lightbox */
.overlay {
  position: fixed; inset: 0; background: rgba(60, 25, 40, .38); display: grid; place-items: center; padding: 16px; z-index: 20;
}
.modal { background: var(--surface); border-radius: var(--r-lg); width: min(560px, 100%); max-height: 90vh; overflow: auto; padding: 24px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 16px; }
.modal h2 { font-size: 20px; }
.modal p { margin: 0; }
.lightbox { position: fixed; inset: 0; background: rgba(25, 10, 18, .88); z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
.lightbox img { max-width: 100%; max-height: calc(100% - 70px); border-radius: var(--r-sm); object-fit: contain; }
.lb-bar { display: flex; gap: 8px; align-items: center; color: #fbe7ef; font-size: 13px; flex-wrap: wrap; justify-content: center; }
.lb-bar .btn { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.2); color: #fff; }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 13px; z-index: 40;
  box-shadow: var(--shadow); max-width: calc(100% - 32px);
}
.progress { font-size: 12px; color: var(--accent-strong); font-weight: 500; }

/* Sign-in + banners */
.auth-wrap { flex: 1; display: grid; place-items: center; padding-block: 24px 48px; }
.auth-card {
  width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow); padding: 28px 24px; display: flex; flex-direction: column; gap: 16px;
}
.auth-card h2 { font-size: 20px; }
.auth-card p { margin: 0; }
.auth-err { background: var(--bad-bg); color: var(--bad-fg); border-radius: var(--r-sm); padding: 8px 12px; font-size: 13px; }
.user-chip { font-size: 12px; color: var(--muted); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.banner {
  background: var(--accent-soft); color: var(--fg); border: 1px solid var(--accent); border-radius: var(--r-md);
  padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 13px;
}
.banner .row { display: flex; gap: 6px; flex-wrap: wrap; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0,1fr); }
  .layout.show-detail .sidebar { display: none; }
  .layout:not(.show-detail) .detail { display: none; }
  .back { display: inline-flex; }
  .d-head { padding: 16px 16px 0; }
  .d-body { padding: 18px 16px 24px; }
  .tabs { padding-inline: 8px; }
  .stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
}
@media (max-width: 520px) {
  .info, .form { grid-template-columns: minmax(0,1fr); }
  .visit { grid-template-columns: minmax(0,1fr); gap: 4px; }
  .d-title h2 { font-size: 21px; }
  .welcome { padding: 28px 18px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <img class="brand-mark" src="icon.svg" alt="" width="44" height="44">
      <div>
        <h1>提携企業</h1>
        <p>企画書・契約書・写真・訪問履歴を提携先ごとにまとめて管理</p>
      </div>
    </div>
    <div class="top-actions" id="topActions" hidden>
      <span class="user-chip" id="userChip"></span>
      <button class="btn ghost" data-act="logout">ログアウト</button>
      <button class="btn" data-act="open-backup">バックアップ</button>
      <button class="btn primary" data-act="open-new" id="newBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        提携先を追加
      </button>
    </div>
  </header>

  <div class="auth-wrap" id="authView" hidden></div>
  <div class="layout" id="layout" hidden>
    <aside class="sidebar" id="sidebar"></aside>
    <main class="detail" id="detail"></main>
  </div>
</div>
<div id="overlayRoot"></div>
<div id="toastRoot"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="config.js"></script>
<script>
(function () {
  "use strict";

  const CFG = (window.TEIKEI_CONFIG && window.TEIKEI_CONFIG.firebase) || {};
  const CATS = [
    { key: "sdf",   label: "自衛隊",            ph: "例：陸上自衛隊 ○○駐屯地", desc: "駐屯地・基地・地方協力本部など" },
    { key: "corp",  label: "企業",              ph: "例：株式会社○○",        desc: "企画・契約を伴う業務提携" },
    { key: "flyer", label: "企業（チラシのみ）", ph: "例：株式会社○○",        desc: "チラシ設置・配布のみの協力先" },
    { key: "store", label: "店舗",              ph: "例：○○商店 △△店",       desc: "店頭掲示・設置協力の店舗" }
  ];
  const CAT = Object.fromEntries(CATS.map(c => [c.key, c]));
  const STATUSES = ["打診中", "交渉中", "提携中", "休止中", "終了"];
  const KINDS = { proposal: "企画書", contract: "契約書", photo: "写真" };
  const OK_TYPES = ["application/pdf", "image/png", "image/jpeg", "image/gif", "image/webp"];
  const EXT_TYPE = { pdf: "application/pdf", png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif", webp: "image/webp" };
  const TYPE_EXT = { "application/pdf": "pdf", "image/png": "png", "image/jpeg": "jpg", "image/gif": "gif", "image/webp": "webp" };
  const MAX_BYTES = 50 * 1048576;
  const LOCAL_DB = "teikei-kigyo";
  const MIGRATED_KEY = "teikei-kigyo-migrated";
  const PARTNER_FIELDS = ["name", "category", "status", "owner", "contact", "phone", "email", "address", "contractStart", "contractEnd", "memo"];

  const today = () => {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  };
  const blankVisit = () => ({ date: today(), person: "", purpose: "", notes: "" });
  const blankNew = () => ({ name: "", category: state.cat !== "all" ? state.cat : "corp", status: "打診中", contact: "" });

  const state = {
    session: null, authReady: false, authErr: "", authBusy: false,
    partners: {}, loaded: false,
    cat: "all", q: "", sel: null, tab: "overview",
    editing: false, draft: null, visitDraft: null, editVisitId: null,
    armed: null, uploading: null, mobileDetail: false,
    modal: false, newDraft: null, backup: false, busy: null, lightbox: null, dragOver: false,
    migrate: null
  };
  state.visitDraft = blankVisit();

  let auth = null, db = null, storage = null;
  let unsubs = [];
  const raw = { partners: null, files: null, visits: null };
  const urls = {};   // file id -> download URL

  /* ---------- helpers ---------- */
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
  const fmtDate = s => s ? s.replace(/-/g, "/") : "";
  const fmtSize = n => n == null ? "" : n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(0) + " KB" : (n / 1048576).toFixed(1) + " MB";
  const fmtStamp = iso => { if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? "" : d.getFullYear() + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getDate()).padStart(2, "0"); };
  const WD = ["日", "月", "火", "水", "木", "金", "土"];
  const weekday = s => { const d = new Date(s + "T00:00:00"); return isNaN(d) ? "" : WD[d.getDay()] + "曜"; };
  const daysUntil = s => { const d = new Date(s + "T00:00:00"); const t = new Date(today() + "T00:00:00"); return Math.round((d - t) / 86400000); };
  const blobUrl = id => urls[id] || "";
  const files = (p, kind) => (p.files || []).filter(f => f.kind === kind);
  const lastVisit = p => (p.visits || []).reduce((m, v) => (!m || v.date > m) ? v.date : m, "");
  const isImg = t => /^image\//.test(t || "");
  const now = () => new Date().toISOString();
  const myId = () => (auth && auth.currentUser && auth.currentUser.uid) || "";

  function toast(msg) {
    const root = document.getElementById("toastRoot");
    root.innerHTML = '<div class="toast" role="status">' + esc(msg) + "</div>";
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { root.innerHTML = ""; }, 3600);
  }
  function arm(key) {
    state.armed = key;
    clearTimeout(arm._t);
    arm._t = setTimeout(() => { if (state.armed === key) { state.armed = null; render(); } }, 4000);
  }
  function errMsg(e) {
    const c = String((e && e.code) || "");
    if (/auth\/(invalid-credential|wrong-password|user-not-found|invalid-login-credentials)/.test(c)) return "メールアドレスまたはパスワードが違います";
    if (c === "auth/invalid-email") return "メールアドレスの形式が正しくありません";
    if (c === "auth/user-disabled") return "このアカウントは無効になっています。管理者に連絡してください";
    if (c === "auth/too-many-requests") return "ログインの試行が多すぎます。しばらく待ってからお試しください";
    if (c === "auth/network-request-failed" || c === "unavailable" || c === "storage/retry-limit-exceeded") return "通信できません。インターネット接続を確認してください";
    if (c === "permission-denied" || c === "storage/unauthorized" || c === "unauthenticated" || c === "storage/unauthenticated") return "この操作をする権限がありません。ログインし直してください";
    if (c === "storage/quota-exceeded" || c === "resource-exhausted") return "保存容量の上限に達しています。管理者に連絡してください";
    if (c === "storage/bucket-not-found" || c === "storage/project-not-found" || c === "storage/no-default-bucket") return "ファイル保存の設定（Storage）がまだです。管理者に連絡してください";
    return "保存に失敗しました。もう一度お試しください";
  }
  function pickPartner(p) {
    const o = {};
    PARTNER_FIELDS.forEach(k => { o[k] = typeof p[k] === "string" ? p[k].trim() : ""; });
    if (!o.name) o.name = "（名称なし）";
    if (!CAT[o.category]) o.category = "corp";
    if (!STATUSES.includes(o.status)) o.status = "打診中";
    return o;
  }

  /* ---------- data (live) ---------- */
  function assemble() {
    if (!raw.partners || !raw.files || !raw.visits) return;
    const m = {};
    raw.partners.forEach(d => { m[d.id] = Object.assign({ id: d.id }, d.data, { files: [], visits: [] }); });
    raw.files.forEach(d => {
      const p = m[d.data.partnerId];
      if (d.data.url) urls[d.id] = d.data.url;
      if (p) p.files.push(Object.assign({ id: d.id, assetId: d.id }, d.data));
    });
    raw.visits.forEach(d => { const p = m[d.data.partnerId]; if (p) p.visits.push(Object.assign({ id: d.id }, d.data)); });
    state.partners = m; state.loaded = true;
    if (state.sel && !m[state.sel]) { state.sel = null; state.mobileDetail = false; state.editing = false; }
    render();
  }
  function listen(name) {
    return db.collection(name).onSnapshot(snap => {
      raw[name] = snap.docs.map(d => ({ id: d.id, data: d.data() }));
      assemble();
    }, e => { toast(errMsg(e)); state.loaded = true; render(); });
  }
  function startApp() {
    state.loaded = false;
    render();
    unsubs = ["partners", "files", "visits"].map(listen);
    checkLocalData();
  }
  function stopApp() {
    unsubs.forEach(u => u()); unsubs = [];
    raw.partners = raw.files = raw.visits = null;
    state.partners = {}; state.loaded = false; state.sel = null; state.editing = false;
    if (state.migrate) { state.migrate.db.close(); state.migrate = null; }
    Object.keys(urls).forEach(k => delete urls[k]);
  }
  const touch = id => db.collection("partners").doc(id).update({ updatedAt: now() });

  async function run(fn, okMsg) {
    try { await fn(); if (okMsg) toast(okMsg); return true; }
    catch (e) { toast(errMsg(e)); return false; }
  }

  async function putFile(partnerId, kind, blob, name, type, uploadedAt) {
    const path = "partners/" + partnerId + "/" + uid() + "." + TYPE_EXT[type];
    const ref = storage.ref(path);
    await ref.put(blob, { contentType: type });
    const url = await ref.getDownloadURL();
    await db.collection("files").add({ partnerId, kind, name, path, url, type, size: blob.size, uploadedAt: uploadedAt || now(), uploadedBy: myId() });
  }
  async function removeStored(path) {
    try { await storage.ref(path).delete(); }
    catch (e) { if (e && e.code !== "storage/object-not-found") throw e; }
  }

  /* ---------- import (backup files and this browser's old data) ---------- */
  async function importPartners(list, getBlob, onStep) {
    let n = 0, fileErrs = 0;
    for (const p of list) {
      const ref = db.collection("partners").doc();
      const t = now();
      await ref.set(Object.assign(pickPartner(p), { createdAt: p.createdAt || t, updatedAt: p.updatedAt || t, createdBy: myId() }));
      for (const f of (p.files || [])) {
        try {
          const blob = getBlob ? await getBlob(f.assetId) : null;
          if (blob) {
            const type = OK_TYPES.includes(blob.type) ? blob.type : (OK_TYPES.includes(f.type) ? f.type : null);
            if (!type) { fileErrs++; continue; }
            await putFile(ref.id, KINDS[f.kind] ? f.kind : "proposal", blob, f.name || "file." + TYPE_EXT[type], type, f.uploadedAt);
          } else if (f.url && f.path) {
            await db.collection("files").add({ partnerId: ref.id, kind: KINDS[f.kind] ? f.kind : "proposal", name: f.name || "file", path: f.path, url: f.url, type: f.type || "", size: f.size || 0, uploadedAt: f.uploadedAt || now(), uploadedBy: myId() });
          } else fileErrs++;
        } catch (e) { fileErrs++; }
      }
      const visits = (p.visits || []).filter(v => v && v.date);
      for (let i = 0; i < visits.length; i += 400) {
        const batch = db.batch();
        visits.slice(i, i + 400).forEach(v => batch.set(db.collection("visits").doc(), { partnerId: ref.id, date: v.date, person: v.person || "", purpose: v.purpose || "", notes: v.notes || "", createdAt: v.createdAt || now(), createdBy: myId() }));
        await batch.commit();
      }
      n++;
      onStep && onStep(n, list.length);
    }
    return { n, fileErrs };
  }

  function idbReq(idb, name, fn) {
    return new Promise((resolve, reject) => {
      const t = idb.transaction(name, "readonly");
      const q = fn(t.objectStore(name));
      q.onsuccess = () => resolve(q.result);
      q.onerror = () => reject(q.error);
    });
  }
  async function checkLocalData() {
    try { if (localStorage.getItem(MIGRATED_KEY)) return; } catch (e) { return; }
    if (!window.indexedDB) return;
    const idb = await new Promise(res => {
      try {
        const r = indexedDB.open(LOCAL_DB);
        r.onupgradeneeded = () => { r.transaction.abort(); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      } catch (e) { res(null); }
    });
    if (!idb) return;
    if (!idb.objectStoreNames.contains("partners") || !idb.objectStoreNames.contains("files")) { idb.close(); return; }
    try {
      const ps = await idbReq(idb, "partners", os => os.getAll());
      if (ps && ps.length && state.session) { state.migrate = { db: idb, partners: ps, step: null }; render(); }
      else idb.close();
    } catch (e) { idb.close(); }
  }
  async function migrateLocal() {
    const mg = state.migrate;
    if (!mg || mg.step) return;
    mg.step = "0/" + mg.partners.length; render();
    try {
      const r = await importPartners(mg.partners, async id => { const rec = await idbReq(mg.db, "files", os => os.get(id)); return rec ? rec.blob : null; },
        (n, t) => { mg.step = n + "/" + t; renderSidebar(); });
      try { localStorage.setItem(MIGRATED_KEY, now()); } catch (e) {}
      mg.db.close(); state.migrate = null;
      toast("このブラウザのデータ " + r.n + " 件を共有データに移しました" + (r.fileErrs ? "（ファイル " + r.fileErrs + " 件は移せませんでした）" : ""));
      render();
    } catch (e) { mg.step = null; toast(errMsg(e)); render(); }
  }

  /* ---------- backup ---------- */
  function saveBlob(blob, name) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  const b64ToBlob = (b64, type) => { const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type }); };

  function exportBackup() {
    const partners = Object.values(state.partners);
    const out = { app: "teikei-kigyo", version: 3, exportedAt: now(), partners, files: [] };
    saveBlob(new Blob([JSON.stringify(out, null, 1)], { type: "application/json" }), "提携企業_バックアップ_" + today() + ".json");
    toast("バックアップを保存しました（" + partners.length + "件）");
  }

  async function importBackup(file) {
    if (!file) return;
    state.busy = "import"; renderOverlay();
    try {
      let json;
      try { json = JSON.parse(await file.text()); } catch (e) { json = null; }
      if (!json || json.app !== "teikei-kigyo" || !Array.isArray(json.partners)) {
        toast("このファイルは読み込めません。「提携企業」のバックアップファイルを選んでください");
      } else {
        const byId = {};
        (json.files || []).forEach(f => { if (f && f.data) byId[f.id] = f; });
        const r = await importPartners(json.partners, async id => byId[id] ? b64ToBlob(byId[id].data, byId[id].type) : null);
        state.backup = false;
        toast("読み込みました（" + r.n + "件）" + (r.fileErrs ? "。ファイル " + r.fileErrs + " 件は読み込めませんでした" : ""));
      }
    } catch (e) { toast(errMsg(e)); }
    state.busy = null; renderOverlay();
  }

  /* ---------- derived ---------- */
  function filtered() {
    const q = state.q.trim().toLowerCase();
    return Object.values(state.partners)
      .filter(p => state.cat === "all" || p.category === state.cat)
      .filter(p => !q || [p.name, p.contact, p.address, p.memo].some(v => (v || "").toLowerCase().includes(q)))
      .sort((a, b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""));
  }
  function counts() {
    const c = { all: 0, sdf: 0, corp: 0, flyer: 0, store: 0 };
    Object.values(state.partners).forEach(p => { c.all++; if (c[p.category] != null) c[p.category]++; });
    return c;
  }
  function contractChip(p) {
    if (!p.contractEnd) return "";
    const d = daysUntil(p.contractEnd);
    if (d < 0) return '<span class="chip bad">契約期限切れ</span>';
    if (d <= 30) return '<span class="chip warn">契約残り <span class="num">' + d + "</span>日</span>";
    return "";
  }
  function statusChip(s) { return '<span class="chip st' + (s === "提携中" ? " active" : "") + '">' + esc(s || "—") + "</span>"; }
  function catChip(k) { const c = CAT[k]; return c ? '<span class="chip ' + k + '">' + esc(c.label) + "</span>" : ""; }

  /* ---------- render: sign-in ---------- */
  function renderAuth() {
    const el = document.getElementById("authView");
    if (!CFG.apiKey || !CFG.projectId) {
      el.innerHTML = '<div class="auth-card"><h2>接続設定がまだです</h2><p class="hint">config.js に Firebase の設定を入れると使えるようになります。</p></div>';
      return;
    }
    if (!auth) {
      el.innerHTML = '<div class="auth-card"><h2>読み込めませんでした</h2><p class="hint">通信状況を確認して、ページを再読み込みしてください。</p></div>';
      return;
    }
    if (!state.authReady) { el.innerHTML = '<div class="auth-card"><p class="hint">読み込み中…</p></div>'; return; }
    if (el.querySelector("#l-email")) {
      el.querySelector(".auth-err-slot").innerHTML = state.authErr ? '<div class="auth-err" role="alert">' + esc(state.authErr) + "</div>" : "";
      const b = el.querySelector("#l-submit");
      b.disabled = state.authBusy; b.textContent = state.authBusy ? "ログイン中…" : "ログイン";
      return;
    }
    el.innerHTML = '<form class="auth-card" data-form="login">' +
      "<h2>ログイン</h2>" +
      '<p class="hint">管理者から受け取ったメールアドレスとパスワードを入力してください。どのパソコン・スマートフォンからでも同じデータを見られます。</p>' +
      '<div class="auth-err-slot">' + (state.authErr ? '<div class="auth-err" role="alert">' + esc(state.authErr) + "</div>" : "") + "</div>" +
      '<div class="field"><label for="l-email">メールアドレス</label><input id="l-email" type="email" autocomplete="username" required></div>' +
      '<div class="field"><label for="l-pass">パスワード</label><input id="l-pass" type="password" autocomplete="current-password" required></div>' +
      '<button class="btn primary" id="l-submit" type="submit">ログイン</button>' +
      '<p class="hint">アカウントの追加やパスワードの再設定は、管理者が Firebase の管理画面から行います。</p>' +
      "</form>";
  }

  /* ---------- render: sidebar ---------- */
  function renderSidebar() {
    const c = counts();
    const list = filtered();
    let h = "";
    if (state.migrate) {
      const mg = state.migrate;
      h += '<div class="banner"><div><b>このブラウザに以前のデータが <span class="num">' + mg.partners.length + "</span> 件あります。</b><br>共有データに移すと、ほかの端末からも見られるようになります。</div>" +
        (mg.step ? '<span class="progress">移行中 <span class="num">' + esc(mg.step) + "</span></span>" :
          '<div class="row"><button class="btn primary sm" data-act="migrate">共有データに移す</button><button class="btn ghost sm" data-act="skip-migrate">' + (state.armed === "skip-migrate" ? "もう一度押すと非表示" : "移さない") + "</button></div>") +
        "</div>";
    }
    h += '<div class="cats" role="group" aria-label="カテゴリー">';
    h += '<button class="cat-tab all" data-act="cat" data-v="all" aria-pressed="' + (state.cat === "all") + '"><span class="lbl">すべての提携先</span><span class="cnt num">' + c.all + '<small>件</small></span></button>';
    CATS.forEach(k => {
      h += '<button class="cat-tab" data-act="cat" data-v="' + k.key + '" aria-pressed="' + (state.cat === k.key) + '"><span class="lbl"><span class="dot ' + k.key + '"></span>' + esc(k.label) + '</span><span class="cnt num">' + c[k.key] + '<small>件</small></span></button>';
    });
    h += "</div>";
    h += '<div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="名称・担当者・住所で検索" value="' + esc(state.q) + '" aria-label="検索"></div>';
    if (!state.loaded) {
      h += '<div class="list-empty">読み込み中…</div>';
    } else if (!list.length) {
      h += '<div class="list-empty">' + (c.all === 0 ? "まだ提携先がありません。右上の「提携先を追加」から登録できます。" : "該当する提携先はありません。") + "</div>";
    } else {
      h += '<ul class="plist">';
      list.forEach(p => {
        const lv = lastVisit(p);
        const fp = files(p, "proposal").length, fc = files(p, "contract").length, ph = files(p, "photo").length;
        h += '<li><button class="pitem" data-act="select" data-id="' + esc(p.id) + '" aria-current="' + (state.sel === p.id) + '">' +
          '<span class="row1"><span class="dot ' + esc(p.category) + '"></span><span class="name">' + esc(p.name) + "</span>" + statusChip(p.status) + "</span>" +
          '<span class="meta"><span>' + esc((CAT[p.category] || {}).label || "") + "</span>" +
          '<span>最終訪問 <span class="num">' + (lv ? fmtDate(lv) : "—") + "</span></span>" +

  /* ---------- render: detail ---------- */

  function renderFiles(p, kind) {
    const list = files(p, kind).slice().sort((a, b) => (b.uploadedAt || "").localeCompare(a.uploadedAt || ""));
    const label = KINDS[kind];
    let h = '<div class="section-h"><h3>' + label + '</h3><p class="hint">' + (kind === "photo" ? "JPEG・PNG・GIF・WebP（1枚50MBまで）" : "PDF・画像（1ファイル50MBまで）") + "</p></div>";

      "</div>";

      h += '<div class="form-actions"><button class="btn" data-act="close-backup">閉じる</button></div>';

  function render() {
    const signedIn = !!state.session;
    document.getElementById("authView").hidden = signedIn;
    document.getElementById("layout").hidden = !signedIn;
    document.getElementById("topActions").hidden = !signedIn;
    if (!signedIn) { renderAuth(); document.getElementById("overlayRoot").innerHTML = ""; return; }
    document.getElementById("userChip").textContent = state.session.email || "";
    renderSidebar();
    renderDetail();
    renderOverlay();
  }

  /* ---------- actions ---------- */
  async function login(email, password) {
    state.authBusy = true; state.authErr = ""; renderAuth();
    try { await auth.signInWithEmailAndPassword(email, password); }
    catch (e) { state.authErr = errMsg(e); }
    state.authBusy = false;
    if (!state.session) renderAuth();
  }

  async function createPartner() {
    const d = state.newDraft;
    if (!d.name.trim()) { toast("名称を入力してください"); return; }
    const ref = db.collection("partners").doc();
    const t = now();
    const data = Object.assign(pickPartner(d), { createdAt: t, updatedAt: t, createdBy: myId() });
    const ok = await run(() => ref.set(data), "「" + data.name + "」を登録しました");
    if (ok) {
      state.modal = false; state.sel = ref.id; state.tab = "overview"; state.editing = false; state.mobileDetail = true;
      state.visitDraft = blankVisit(); state.editVisitId = null;
      if (state.cat !== "all" && state.cat !== data.category) state.cat = data.category;
      render();
    }
  }

  async function deletePartner(p) {
    const ok = await run(async () => {
      for (const f of (p.files || [])) await removeStored(f.path);
      const refs = (p.files || []).map(f => db.collection("files").doc(f.id))
        .concat((p.visits || []).map(v => db.collection("visits").doc(v.id)));
      for (let i = 0; i < refs.length; i += 400) {
        const batch = db.batch();
        refs.slice(i, i + 400).forEach(r => batch.delete(r));
        await batch.commit();
      }
      await db.collection("partners").doc(p.id).delete();
    }, "「" + p.name + "」を削除しました");
    if (ok) { state.sel = null; state.mobileDetail = false; state.editing = false; render(); }
  }

  async function uploadFiles(kind, fileList) {
    const p = state.partners[state.sel];
    if (!p || state.uploading) return;
    const arr = Array.from(fileList || []);
    if (!arr.length) return;
    const pid = p.id;
    state.uploading = { kind, done: 0, total: arr.length };
    render();
    let added = 0;
    const errs = [];
    for (const f of arr) {
      const ext = (f.name.split(".").pop() || "").toLowerCase();
      const type = OK_TYPES.includes(f.type) ? f.type : EXT_TYPE[ext];
      if (!type || (kind === "photo" && !type.startsWith("image/"))) {
        errs.push(f.name + "：" + (ext === "heic" ? "HEIC形式は未対応です。JPEGで保存し直してください" : "対応していない形式です（PDF・JPEG・PNG・GIF・WebP）"));
      } else if (f.size > MAX_BYTES) {
        errs.push(f.name + "：50MBを超えています");
      } else {
        try { await putFile(pid, kind, f, f.name, type); added++; }
        catch (e) { errs.push(f.name + "：" + errMsg(e)); }
      }
      state.uploading.done++;
      renderDetail();
    }
    state.uploading = null;
    if (added) { try { await touch(pid); } catch (e) {} }
    if (errs.length) toast(errs.join(" / "));
    else if (added) toast(KINDS[kind] + "を " + added + " 件追加しました");
    render();
  }

  async function deleteFile(fileId) {
    const p = state.partners[state.sel];
    const f = p && (p.files || []).find(x => x.assetId === fileId);
    if (!f) return;
    const ok = await run(async () => {
      await removeStored(f.path);
      await db.collection("files").doc(f.id).delete();
      await touch(p.id);
    }, f.name + " を削除しました");
    if (ok && state.lightbox === fileId) { state.lightbox = null; renderOverlay(); }
  }

  async function saveVisit() {
    const p = state.partners[state.sel];
    const d = state.visitDraft;
    if (!p) return;
    if (!d.date) { toast("訪問日を入力してください"); return; }
    const clean = { date: d.date, person: d.person.trim(), purpose: d.purpose.trim(), notes: d.notes.trim() };
    const editing = state.editVisitId;
    const ok = await run(async () => {
      if (editing) await db.collection("visits").doc(editing).update(clean);
      else await db.collection("visits").add(Object.assign({ partnerId: p.id, createdAt: now(), createdBy: myId() }, clean));
      await touch(p.id);
    }, editing ? "訪問記録を更新しました" : "訪問を記録しました");
    if (ok) { state.visitDraft = blankVisit(); state.editVisitId = null; render(); }
  }

  async function deleteVisit(p, id) {
    if (state.editVisitId === id) { state.editVisitId = null; state.visitDraft = blankVisit(); }
    await run(async () => { await db.collection("visits").doc(id).delete(); await touch(p.id); }, "訪問記録を削除しました");
  }

  async function saveEdit() {
    const p = state.partners[state.sel];
    const d = state.draft;
    if (!p || !d) return;
    if (!d.name.trim()) { toast("名称を入力してください"); return; }
    const ok = await run(() => db.collection("partners").doc(p.id).update(Object.assign(pickPartner(d), { updatedAt: now() })), "基本情報を保存しました");
    if (ok) { state.editing = false; state.draft = null; render(); }
  }

  /* ---------- events ---------- */
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-act]");
    if (!t) return;
    const act = t.dataset.act, v = t.dataset.v;
    const p = state.sel && state.partners[state.sel];
    switch (act) {
      case "logout": auth && auth.signOut(); break;
      case "migrate": migrateLocal(); break;
      case "skip-migrate":
        if (state.armed === "skip-migrate") {
          state.armed = null;
          try { localStorage.setItem(MIGRATED_KEY, "skipped"); } catch (err) {}
          if (state.migrate) state.migrate.db.close();
          state.migrate = null; render();
        } else { arm("skip-migrate"); render(); }
        break;
      case "cat": state.cat = v; render(); break;
      case "select":
        if (state.sel !== t.dataset.id) { state.tab = "overview"; state.editing = false; state.draft = null; state.visitDraft = blankVisit(); state.editVisitId = null; state.armed = null; }
        state.sel = t.dataset.id; state.mobileDetail = true; render();
        if (window.matchMedia("(max-width: 860px)").matches) window.scrollTo(0, 0);
        break;
      case "back": state.mobileDetail = false; render(); break;
      case "tab": state.tab = v; state.armed = null; render(); break;
      case "open-new": state.newDraft = blankNew(); state.modal = true; renderOverlay(); break;
      case "close-modal": state.modal = false; renderOverlay(); break;
      case "close-modal-bg": if (e.target === t) { state.modal = false; renderOverlay(); } break;
      case "open-backup": state.backup = true; renderOverlay(); break;
      case "close-backup": if (!state.busy) { state.backup = false; renderOverlay(); } break;
      case "close-backup-bg": if (e.target === t && !state.busy) { state.backup = false; renderOverlay(); } break;
      case "export": if (!state.busy) exportBackup(); break;
      case "pick-cat":
        if (t.dataset.target === "new") { state.newDraft.category = v; renderOverlay(); }
        else { state.draft.category = v; renderDetail(); }
        break;
      case "edit":
        state.draft = {};
        PARTNER_FIELDS.forEach(k => state.draft[k] = (p && p[k]) || "");
        state.editing = true; state.tab = "overview"; render(); break;
      case "cancel-edit": state.editing = false; state.draft = null; render(); break;
      case "del-partner":
        if (state.armed === "del-partner") { state.armed = null; deletePartner(p); } else { arm("del-partner"); render(); }
        break;
      case "del-file":
        if (state.armed === "del-file-" + v) { state.armed = null; deleteFile(v); } else { arm("del-file-" + v); render(); }
        break;
      case "del-visit":
        if (state.armed === "del-visit-" + v) { state.armed = null; deleteVisit(p, v); } else { arm("del-visit-" + v); render(); }
        break;
      case "edit-visit": {
        const vv = (p.visits || []).find(x => x.id === v);
        if (vv) { state.editVisitId = v; state.visitDraft = { date: vv.date, person: vv.person || "", purpose: vv.purpose || "", notes: vv.notes || "" }; render(); const el = document.getElementById("v-date"); el && el.focus(); }
        break;
      }
      case "cancel-visit": state.editVisitId = null; state.visitDraft = blankVisit(); render(); break;
      case "lightbox": state.lightbox = v; renderOverlay(); break;
      case "close-lb": state.lightbox = null; renderOverlay(); break;
      case "close-lb-bg": if (e.target === t) { state.lightbox = null; renderOverlay(); } break;
      case "lb-step": {
        const ph = files(p, "photo");
        const i = ph.findIndex(f => f.assetId === state.lightbox);
        state.lightbox = ph[(i + Number(v) + ph.length) % ph.length].assetId; renderOverlay(); break;
      }
    }
  });

  document.addEventListener("input", e => {
    const t = e.target;
    if (t.id === "q") { state.q = t.value; renderSidebar(); return; }
    const b = t.dataset && t.dataset.draft;
    if (!b) return;
    const [scope, key] = b.split(":");
    const obj = scope === "draft" ? state.draft : scope === "visit" ? state.visitDraft : state.newDraft;
    if (obj) obj[key] = t.value;
  });
  document.addEventListener("change", e => {
    const t = e.target;
    if (t.dataset && t.dataset.upload) { uploadFiles(t.dataset.upload, t.files); t.value = ""; }
    else if (t.dataset && t.dataset.import) { importBackup(t.files && t.files[0]); t.value = ""; }
  });
  document.addEventListener("submit", e => {
    e.preventDefault();
    const f = e.target.dataset.form;
    if (f === "login") { if (!state.authBusy) login(document.getElementById("l-email").value.trim(), document.getElementById("l-pass").value); }
    else if (f === "new") createPartner();
    else if (f === "edit") saveEdit();
    else if (f === "visit") saveVisit();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      if (state.lightbox) { state.lightbox = null; renderOverlay(); }
      else if (state.modal) { state.modal = false; renderOverlay(); }
      else if (state.backup && !state.busy) { state.backup = false; renderOverlay(); }
    } else if (state.lightbox && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
      const p = state.partners[state.sel]; const ph = files(p, "photo");
      const i = ph.findIndex(f => f.assetId === state.lightbox);
      state.lightbox = ph[(i + (e.key === "ArrowRight" ? 1 : -1) + ph.length) % ph.length].assetId; renderOverlay();
    }
  });
  ["dragenter", "dragover"].forEach(ev => document.addEventListener(ev, e => {
    const z = e.target.closest && e.target.closest("[data-drop]");
    if (!z) return;
    e.preventDefault();
    if (state.dragOver !== z.dataset.drop) { state.dragOver = z.dataset.drop; z.classList.add("over"); }
  }));
  document.addEventListener("dragleave", e => {
    const z = e.target.closest && e.target.closest("[data-drop]");
    if (z && !z.contains(e.relatedTarget)) { state.dragOver = false; z.classList.remove("over"); }
  });
  document.addEventListener("drop", e => {
    const z = e.target.closest && e.target.closest("[data-drop]");
    if (!z) return;
    e.preventDefault();
    state.dragOver = false;
    uploadFiles(z.dataset.drop, e.dataTransfer.files);
  });

  /* ---------- boot ---------- */
  function boot() {
    if (CFG.apiKey && CFG.projectId && window.firebase && firebase.initializeApp) {
      try {
        firebase.initializeApp(CFG);
        auth = firebase.auth();
        db = firebase.firestore();
        storage = firebase.storage();
        auth.onAuthStateChanged(user => {
          const was = !!state.session;
          state.authReady = true;
          state.session = user ? { uid: user.uid, email: user.email || "" } : null;
          if (user && !was) startApp();
          else if (!user && was) { stopApp(); state.authErr = ""; }
          render();
        });
      } catch (e) { auth = null; }
    }
    render();
  }
  boot();
})();
</script>
</body>
</html>
