    <!-- right hand fingers wrapping over the left hand -->
    <rect x="186" y="270" width="38" height="92" rx="19" fill="#ffd0df" transform="rotate(16 205 316)"/>
    <rect x="222" y="266" width="38" height="98" rx="19" fill="#ffd0df" transform="rotate(16 241 315)"/>
    <rect x="258" y="262" width="38" height="98" rx="19" fill="#ffd0df" transform="rotate(16 277 311)"/>
    <!-- left thumb on top -->
