<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="35%" cy="25%" r="85%">
      <stop offset="0" stop-color="#ffd6e4"/>
      <stop offset="1" stop-color="#f4a3c0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- heart + sparkles -->
  <path d="M256 176 C 256 176 204 142 204 108 C 204 87 221 74 238 74 C 248 74 254 80 256 87 C 258 80 264 74 274 74 C 291 74 308 87 308 108 C 308 142 256 176 256 176 Z" fill="#ffffff"/>
  <path d="M118 128 l8 18 18 8 -18 8 -8 18 -8 -18 -18 -8 18 -8 z" fill="#ffffff" opacity=".9"/>
  <path d="M396 104 l6 13 13 6 -13 6 -6 13 -6 -13 -13 -6 13 -6 z" fill="#ffffff" opacity=".9"/>

  <g stroke="#b8466f" stroke-width="13" stroke-linejoin="round">
    <!-- sleeves -->
    <rect x="44" y="270" width="84" height="124" rx="26" fill="#e9739c" transform="rotate(-20 86 332)"/>
    <rect x="384" y="270" width="84" height="124" rx="26" fill="#e9739c" transform="rotate(20 426 332)"/>
