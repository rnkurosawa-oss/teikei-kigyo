  <!-- blush -->
  <ellipse cx="150" cy="330" rx="14" ry="9" fill="#f48fb1" opacity=".55"/>
  <ellipse cx="372" cy="298" rx="14" ry="9" fill="#f06a98" opacity=".35"/>
